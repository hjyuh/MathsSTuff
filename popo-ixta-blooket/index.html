<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Volcano Clash</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">VC</span>
          <div>
            <h1>Volcano Clash</h1>
            <p>Popocatépetl e Ixtaccíhuatl</p>
          </div>
        </div>
        <div class="status-grid" aria-label="Game status">
          <div>
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>Streak</span>
            <strong id="streak">0</strong>
          </div>
          <div>
            <span>Round</span>
            <strong id="round">0/0</strong>
          </div>
          <div>
            <span>Time</span>
            <strong id="timer">0:00</strong>
          </div>
        </div>
      </header>

      <section class="setup-panel" id="setupPanel">
        <div class="volcano-stage">
          <svg class="volcano-art" viewBox="0 0 960 540" role="img" aria-label="Volcano practice game art">
            <defs>
              <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#193149"></stop>
                <stop offset="0.58" stop-color="#2f686b"></stop>
                <stop offset="1" stop-color="#f3b43f"></stop>
              </linearGradient>
              <linearGradient id="slope" x1="0" x2="1">
                <stop offset="0" stop-color="#2d3f3a"></stop>
                <stop offset="0.52" stop-color="#4f5946"></stop>
                <stop offset="1" stop-color="#1e3446"></stop>
              </linearGradient>
              <linearGradient id="lava" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#fff0a6"></stop>
                <stop offset="0.45" stop-color="#f36c32"></stop>
                <stop offset="1" stop-color="#cf2f24"></stop>
              </linearGradient>
            </defs>
            <rect width="960" height="540" fill="url(#sky)"></rect>
            <circle cx="792" cy="94" r="48" fill="#ffe7a3" opacity="0.95"></circle>
            <path d="M0 382 C96 338 170 358 256 320 C348 280 414 320 492 292 C610 250 734 304 960 250 L960 540 L0 540 Z" fill="#173629" opacity="0.68"></path>
            <path d="M56 540 L364 124 L602 540 Z" fill="url(#slope)"></path>
            <path d="M232 540 L598 96 L910 540 Z" fill="#25394d"></path>
            <path d="M312 190 L364 124 L432 218 C392 204 356 204 312 190 Z" fill="#eef3f6"></path>
            <path d="M536 170 L598 96 L676 204 C620 182 586 184 536 170 Z" fill="#f4f7f7"></path>
            <path class="lava-flow" d="M588 162 C610 220 560 260 594 324 C628 392 578 438 602 540 L544 540 C522 456 566 398 528 328 C494 266 548 226 526 178 Z" fill="url(#lava)"></path>
            <path d="M498 170 C548 130 660 128 718 170 C686 194 538 196 498 170 Z" fill="#22272b" opacity="0.86"></path>
            <path class="smoke smoke-one" d="M580 110 C532 82 542 34 598 28 C628 -10 708 10 694 62 C748 70 754 128 700 140 C660 168 612 136 580 110 Z" fill="#edf2f4" opacity="0.66"></path>
            <path class="smoke smoke-two" d="M440 112 C404 88 412 48 458 46 C474 16 540 26 532 68 C572 78 578 122 536 134 C502 154 468 130 440 112 Z" fill="#f8fafc" opacity="0.52"></path>
            <path d="M0 454 C132 428 208 456 320 430 C458 398 576 448 704 414 C812 386 880 408 960 388 L960 540 L0 540 Z" fill="#1d523d"></path>
          </svg>
          <div class="deck-stat-row">
            <div>
              <span>Terms</span>
              <strong id="termCount">37</strong>
            </div>
            <div>
              <span>Questions</span>
              <strong id="questionCount">74</strong>
            </div>
            <div>
              <span>Best</span>
              <strong id="bestScore">0</strong>
            </div>
          </div>
        </div>

        <div class="setup-controls">
          <div class="field-row">
            <label for="playerName">Player</label>
            <input id="playerName" type="text" maxlength="18" value="Player 1">
          </div>
          <div class="segmented" role="group" aria-label="Question direction">
            <button class="segment active" type="button" data-mode="mixed">Mixed</button>
            <button class="segment" type="button" data-mode="es-en">ES → EN</button>
            <button class="segment" type="button" data-mode="en-es">EN → ES</button>
          </div>
          <div class="field-row compact">
            <label for="roundCount">Rounds</label>
            <input id="roundCount" type="number" min="5" max="74" value="74">
          </div>
          <div class="toggle-row">
            <input id="timerToggle" type="checkbox" checked>
            <label for="timerToggle">Timed</label>
          </div>
          <button class="primary-action" type="button" id="startBtn">Start Game</button>
        </div>
      </section>

      <section class="study-panel" id="studyPanel">
        <div class="targets-panel">
          <h2>I can</h2>
          <ol id="targetList"></ol>
        </div>
        <div class="deck-panel">
          <h2>Deck</h2>
          <div class="deck-list" id="deckList"></div>
        </div>
      </section>

      <section class="game-panel hidden" id="gamePanel" aria-live="polite">
        <div class="question-stage">
          <div class="category-pill" id="categoryLabel"></div>
          <div class="prompt-card">
            <span id="modeLabel">Mixed</span>
            <strong id="promptText"></strong>
          </div>
          <div class="volcano-meter" aria-label="Streak meter">
            <span id="meterFill"></span>
          </div>
        </div>
        <aside class="play-panel">
          <div class="answer-grid" id="answerGrid"></div>
          <div class="feedback-panel hidden" id="feedbackPanel">
            <div class="feedback-copy">
              <span id="feedbackKicker">Result</span>
              <strong id="feedbackTitle"></strong>
              <p id="feedbackText"></p>
            </div>
            <button class="primary-action" type="button" id="nextBtn">Next Round</button>
          </div>
        </aside>
      </section>

      <section class="end-panel hidden" id="endPanel">
        <div class="final-score">
          <span>Final Score</span>
          <strong id="finalScore">0</strong>
          <p id="finalSummary"></p>
        </div>
        <div class="review-list" id="reviewList"></div>
        <div class="end-actions">
          <button class="secondary-action" type="button" id="reviewMissedBtn">Review Missed</button>
          <button class="primary-action" type="button" id="playAgainBtn">Play Again</button>
        </div>
      </section>
    </main>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
